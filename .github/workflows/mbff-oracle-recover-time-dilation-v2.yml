name: mbff-oracle-recover-time-dilation-v2

on:
  push:
    paths:
      - ".mbff-control/recover-time-dilation-v2.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: mbff-oracle-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      NB_ID: ef32ab87-5716-4125-acfd-28234d5f9b5d
      ART_ID: 06a89b8e-23d8-4d5c-978e-106da6afb177
      DRIVE_FILE_ID: 1-U3nR3B_ITxy_Npz1ngDZcXDKSZKOHfg
    steps:
      - uses: actions/checkout@v4

      - name: Verify Oracle host
        run: |
          set -euo pipefail
          test "$(hostname)" = "instance-20260211-2148"
          test "$(whoami)" = "ubuntu"

      - name: Authenticate keylessly to MBFF Google project
        uses: google-github-actions/auth@v3
        with:
          project_id: mbff-cloud-publisher-wt26
          workload_identity_provider: projects/209601201824/locations/global/workloadIdentityPools/github-mbff/providers/github
          service_account: mbff-oracle-drive@mbff-cloud-publisher-wt26.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Direct-download existing video on Oracle
        continue-on-error: true
        run: |
          set +e
          ROOT="$HOME/mbff-notebooklm-worker"
          AUTH="$ROOT/auth/storage_state.json"
          CLI="$ROOT/recovery-venv-081/bin/notebooklm"
          OUT="$ROOT/downloads/day48/day48_notebooklm_raw.mp4"
          RESULT=/tmp/mbff-recover-v2-result.json
          mkdir -p "$(dirname "$OUT")"
          rm -f "$OUT"
          printf '%s\n' '{"ok":false,"status":"STARTED"}' > "$RESULT"

          "$CLI" --storage "$AUTH" list --json >/tmp/mbff-v2-list.json 2>/tmp/mbff-v2-list.err
          if [ $? -ne 0 ]; then
            printf '%s\n' '{"ok":false,"status":"ORACLE_NOTEBOOKLM_AUTH_FAILED"}' > "$RESULT"; exit 0
          fi

          # Cinematic-video is an alias for video in notebooklm-py. Use the
          # underlying command directly because the alias can lose global auth context.
          "$CLI" --storage "$AUTH" download video "$OUT" -n "$NB_ID" -a "$ART_ID" --force --json >/tmp/mbff-v2-download.json 2>/tmp/mbff-v2-download.err
          rc=$?
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PY'
          import json,re
          from pathlib import Path
          raw=''
          for p in ('/tmp/mbff-v2-download.err','/tmp/mbff-v2-download.json'):
              try: raw+='\n'+Path(p).read_text(errors='replace')
              except Exception: pass
          low=raw.lower()
          if 'storage file not found' in low: status='CLI_STORAGE_CONTEXT_FAILED'
          elif '401' in low or 'authentication required' in low: status='MEDIA_CDN_AUTH_401'
          elif '403' in low: status='MEDIA_CDN_AUTH_403'
          elif 'no completed' in low or 'not ready' in low: status='ARTIFACT_REPORTED_NOT_READY'
          else: status='DIRECT_DOWNLOAD_FAILED'
          safe=re.sub(r'https?://\S+','<redacted-url>',raw)
          safe=re.sub(r'(?i)(cookie|authorization|token)(\s*[:=]\s*)\S+',r'\1\2<redacted>',safe)
          safe=re.sub(r'[A-Za-z0-9_\-]{80,}','<redacted-long-value>',safe)
          safe=' '.join(safe.split())[:500]
          json.dump({'ok':False,'status':status,'detail':safe},open('/tmp/mbff-recover-v2-result.json','w'),indent=2,sort_keys=True)
          PY
            rm -f "$OUT"; exit 0
          fi

          ffprobe -v error -show_streams -show_format -of json "$OUT" >/tmp/mbff-v2-ffprobe.json 2>/tmp/mbff-v2-ffprobe.err
          if [ $? -ne 0 ]; then
            printf '%s\n' '{"ok":false,"status":"FFPROBE_FAILED"}' > "$RESULT"; rm -f "$OUT"; exit 0
          fi

          OUT="$OUT" python3 - <<'PY'
          import json,os,sys
          d=json.load(open('/tmp/mbff-v2-ffprobe.json'))
          streams=d.get('streams',[])
          v=[s for s in streams if s.get('codec_type')=='video']
          a=[s for s in streams if s.get('codec_type')=='audio']
          if not v or not a: sys.exit(2)
          w=int(v[0].get('width') or 0); h=int(v[0].get('height') or 0)
          dur=float(d.get('format',{}).get('duration') or 0)
          size=os.path.getsize(os.environ['OUT'])
          if not (w and h and abs(w/h-16/9)<=0.08 and dur>=120 and size>=100000): sys.exit(3)
          json.dump({'bytes':size,'width':w,'height':h,'duration_seconds':dur},open('/tmp/mbff-v2-qc.json','w'))
          PY
          if [ $? -ne 0 ]; then
            printf '%s\n' '{"ok":false,"status":"MEDIA_QC_FAILED"}' > "$RESULT"; rm -f "$OUT"; exit 0
          fi

          OUT="$OUT" "$ROOT/.venv/bin/python" - <<'PY' >/tmp/mbff-v2-drive.out 2>/tmp/mbff-v2-drive.err
          import os,google.auth
          from google.auth.transport.requests import AuthorizedSession
          creds,_=google.auth.default(scopes=['https://www.googleapis.com/auth/drive'])
          s=AuthorizedSession(creds)
          with open(os.environ['OUT'],'rb') as f:
              r=s.patch('https://www.googleapis.com/upload/drive/v3/files/'+os.environ['DRIVE_FILE_ID']+'?uploadType=media',data=f,headers={'Content-Type':'video/mp4'},timeout=900)
          r.raise_for_status()
          PY
          if [ $? -ne 0 ]; then
            printf '%s\n' '{"ok":false,"status":"DRIVE_UPLOAD_FAILED"}' > "$RESULT"; exit 0
          fi

          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/mbff-v2-qc.json'))
          json.dump({'ok':True,'status':'RECOVERED_TO_DRIVE','notebook_id':'ef32ab87-5716-4125-acfd-28234d5f9b5d','artifact_id':'06a89b8e-23d8-4d5c-978e-106da6afb177','drive_file_id':'1-U3nR3B_ITxy_Npz1ngDZcXDKSZKOHfg','qc':q},open('/tmp/mbff-recover-v2-result.json','w'),indent=2,sort_keys=True)
          PY

      - name: Commit sanitized recovery evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .mbff-control/results
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          try: d=json.loads(Path('/tmp/mbff-recover-v2-result.json').read_text())
          except Exception: d={'ok':False,'status':'RECOVERY_RESULT_MISSING'}
          d['schema_version']=1
          d['checked_at']=datetime.now(timezone.utc).isoformat()
          d['run_id']='${{ github.run_id }}'
          Path('.mbff-control/results/recover-time-dilation-v2.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "mbff-oracle-worker"
          git config user.email "actions@users.noreply.github.com"
          git add .mbff-control/results/recover-time-dilation-v2.json
          git commit -m "Record MBFF Oracle direct video recovery v2" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
