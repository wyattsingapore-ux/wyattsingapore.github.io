name: mbff-gcp-admin-probe

on:
  push:
    paths:
      - ".mbff-bootstrap/gcp-admin-probe.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Oracle host and gcloud identity
        run: |
          set -euo pipefail
          test "$(hostname)" = "instance-20260211-2148"
          test "$(whoami)" = "ubuntu"
          mkdir -p .mbff-bootstrap/results
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          p=subprocess.run(['gcloud','auth','list','--filter=status:ACTIVE','--format=value(account)'],text=True,capture_output=True,timeout=30)
          active=(p.stdout or '').strip().splitlines()
          account=active[0] if active else ''
          payload={
            'schema_version':1,
            'completed':p.returncode==0,
            'human_active':account.lower()=='wyattsingapore@gmail.com',
            'bot_active':account.startswith('oracle-qcc-bot@'),
            'active_account_class':'human' if account.lower()=='wyattsingapore@gmail.com' else ('qcc_bot' if account.startswith('oracle-qcc-bot@') else 'other_or_none'),
            'checked_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('.mbff-bootstrap/results/gcp-admin-probe.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit sanitized result
        run: |
          set -euo pipefail
          git config user.name "mbff-oracle-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .mbff-bootstrap/results/gcp-admin-probe.json
          git commit -m "Record active Oracle gcloud identity" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
