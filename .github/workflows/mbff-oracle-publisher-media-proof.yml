name: mbff-oracle-publisher-media-proof

on:
  push:
    branches: [main]
    paths:
      - '.mbff-control/publisher-media-proof.json'

permissions:
  contents: write
  id-token: write

concurrency:
  group: mbff-oracle-publisher
  cancel-in-progress: false

jobs:
  media-proof:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify generic Oracle request
        run: |
          set -euo pipefail
          test "$(hostname)" = "instance-20260211-2148"
          test "$(whoami)" = "ubuntu"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.mbff-control/publisher-media-proof.json').read_text())
          assert d.get('schema_version') == 1
          assert d.get('action') == 'publisher_media_proof'
          assert d.get('mutating') is False
          # Keep public control generic: no episode, title, Drive ID or media name.
          forbidden={'episode_id','title','drive_file_id','source','file_name'}
          assert not (forbidden & set(d))
          PY

      - name: Authenticate keylessly to MBFF Google project
        uses: google-github-actions/auth@v3
        with:
          project_id: mbff-cloud-publisher-wt26
          workload_identity_provider: projects/209601201824/locations/global/workloadIdentityPools/github-mbff/providers/github
          service_account: mbff-oracle-drive@mbff-cloud-publisher-wt26.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Download master and render portrait derivative on Oracle
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ROOT="$HOME/mbff-publisher"
          "$ROOT/bin/mbff-publish" run-job \
            --job "$ROOT/run/current-job.json" \
            --root "$ROOT" \
            --media-only \
            > /tmp/mbff-publisher-media-proof.json 2>/tmp/mbff-publisher-media-proof.err
          echo $? > /tmp/mbff-publisher-media-proof.code
          exit 0

      - name: Commit sanitized media proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mbff-control/results
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              rc=int(Path('/tmp/mbff-publisher-media-proof.code').read_text().strip())
          except Exception:
              rc=999
          try:
              raw=json.loads(Path('/tmp/mbff-publisher-media-proof.json').read_text())
          except Exception:
              raw={}
          completed=(rc==0 and raw.get('media_prepared') is True)
          out={
              'schema_version':1,
              'completed':completed,
              'status':'MEDIA_PROOF_COMPLETE' if completed else 'MEDIA_PROOF_FAILED',
              'exit_code':rc,
              'master':{k:raw.get('master',{}).get(k) for k in ('bytes','duration_seconds','width','height','sha256')},
              'short':{k:raw.get('short',{}).get(k) for k in ('bytes','duration_seconds','width','height','sha256')},
              'checked_at':datetime.now(timezone.utc).isoformat(),
          }
          # Never publish local paths, Drive identifiers, ADC paths, tokens or upload URLs.
          Path('.mbff-control/results/publisher-media-proof.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'mbff-oracle-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add .mbff-control/results/publisher-media-proof.json
          git commit -m 'Record sanitized MBFF publisher media proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
