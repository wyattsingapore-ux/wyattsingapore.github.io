name: mbff-gcp-probe

on:
  push:
    paths:
      - ".mbff-bootstrap/gcp-probe.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Oracle host
        run: |
          set -euo pipefail
          test "$(hostname)" = "instance-20260211-2148"
          test "$(whoami)" = "ubuntu"
      - name: Probe gcloud context read-only
        run: |
          set -euo pipefail
          mkdir -p .mbff-bootstrap/results
          python3 - <<'PY'
          import json, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          g=shutil.which('gcloud')
          payload={'schema_version':1,'completed':True,'mutating':False,'gcloud_installed':bool(g),'active_auth':False,'projects':[],'checked_at':datetime.now(timezone.utc).isoformat()}
          if g:
              a=subprocess.run([g,'auth','list','--filter=status:ACTIVE','--format=value(account)'],text=True,capture_output=True,timeout=30)
              payload['active_auth']=bool(a.stdout.strip()) and a.returncode==0
              if payload['active_auth']:
                  p=subprocess.run([g,'projects','list','--format=value(projectId)'],text=True,capture_output=True,timeout=60)
                  if p.returncode==0:
                      payload['projects']=[x for x in p.stdout.splitlines() if x.strip()][:30]
          Path('.mbff-bootstrap/results/gcp-probe.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit sanitized result
        run: |
          set -euo pipefail
          git config user.name "mbff-oracle-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .mbff-bootstrap/results/gcp-probe.json
          git commit -m "Record MBFF GCP bootstrap probe" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
