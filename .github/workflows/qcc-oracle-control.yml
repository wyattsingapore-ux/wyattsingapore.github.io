name: QCC Oracle Control

on:
  push:
    branches: [qcc-chatgpt-ops]
    paths:
      - qcc-control-command.txt

permissions:
  contents: read

jobs:
  qcc-control:
    runs-on: [self-hosted, linux, x64, qcc-oracle]
    timeout-minutes: 5
    steps:
      - name: Read allowlisted command
        id: cmd
        shell: bash
        run: |
          set -euo pipefail
          cmd="$(curl -fsSL -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/wyattsingapore-ux/wyattsingapore.github.io/contents/qcc-control-command.txt?ref=${GITHUB_SHA}" | tr -d '\r\n')"
          case "$cmd" in
            status|trigger-logs|opportunity-logs|mcp-logs|tests|scanner-status|scanner-smoke|pull-ops|install-opportunity|restart-trigger|restart-opportunity|restart-mcp|stop-trigger|dispatcher-diff|dispatcher-clean-mode) ;;
            *) echo "Rejected command: $cmd" >&2; exit 64 ;;
            esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"
      - name: Execute restricted Oracle dispatcher
        shell: bash
        run: |
          set -euo pipefail
          cmd="${{ steps.cmd.outputs.command }}"
          if [ "$cmd" = "dispatcher-diff" ]; then
            git -C /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops status --short -- qcc-control-mcp/ops_dispatch.py
            git -C /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops diff -- qcc-control-mcp/ops_dispatch.py
          elif [ "$cmd" = "dispatcher-clean-mode" ]; then
            chmod 0644 /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/qcc-control-mcp/ops_dispatch.py
            git -C /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops status --short -- qcc-control-mcp/ops_dispatch.py
          else
            /usr/bin/python3 /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/qcc-control-mcp/ops_dispatch.py "$cmd"
          fi
