name: QCC Oracle Control

on:
  push:
    branches: [qcc-chatgpt-ops]
    paths:
      - qcc-control-command.txt
      - qcc-alert-format-deploy.txt

permissions:
  contents: read

jobs:
  qcc-control:
    runs-on: [self-hosted, linux, x64, qcc-oracle]
    timeout-minutes: 5
    steps:
      - name: Read allowlisted command
        id: cmd
        shell: bash
        run: |
          set -euo pipefail
          cmd="$(curl -fsSL -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/wyattsingapore-ux/wyattsingapore.github.io/contents/qcc-control-command.txt?ref=${GITHUB_SHA}" | tr -d '\r\n')"
          case "$cmd" in
            status|trigger-logs|opportunity-logs|mcp-logs|tests|scanner-status|scanner-smoke|pull-ops|install-opportunity|restart-trigger|restart-opportunity|restart-mcp|stop-trigger|dispatcher-diff|dispatcher-clean-mode) ;;
            *) echo "Rejected command: $cmd" >&2; exit 64 ;;
            esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"
      - name: Deploy QCC Telegram decision guide
        if: contains(github.event.head_commit.message, 'Deploy QCC Telegram decision guide')
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import ast, py_compile, subprocess, textwrap

          p = Path('/home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/chatgpt_trigger_monitor.py')
          backup = p.with_name(p.name + '.bak.qcc-alert-v1')
          src = p.read_text()
          marker = '# QCC_DECISION_GUIDE_V1'
          if marker in src:
              print('Decision guide already installed; no source change needed.')
              raise SystemExit(0)

          tree = ast.parse(src)
          fn = next((n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'format_alert'), None)
          if fn is None:
              raise SystemExit('format_alert function not found')

          new_fn = textwrap.dedent('''
          # QCC_DECISION_GUIDE_V1
          def format_alert(s: SignalSnapshot, now_et: datetime) -> str:
              """Telegram alert with actionable entry, risk and target levels."""
              status = str(s.status).upper()
              is_short = 'SHORT' in status and 'LONG' not in status
              side = 'SHORT' if is_short else 'LONG'
              trigger = float(s.down_trigger if is_short else s.up_trigger)
              current = float(s.observed_price)
              atr14 = max(abs(float(s.atr14)), 0.01)
              stop = float(s.up_trigger if is_short else s.down_trigger)
              risk = abs(trigger - stop)
              if risk < 0.01:
                  risk = atr14
                  stop = trigger + risk if is_short else trigger - risk

              # Entry zones are volatility-scaled so different tickers do not share
              # an arbitrary fixed percentage threshold.
              enter_buffer = 0.50 * atr14
              late_buffer = 1.25 * atr14
              if is_short:
                  enterable = trigger - enter_buffer
                  too_late = trigger - late_buffer
                  chasing_text = f"{too_late:.2f} – {enterable:.2f}"
                  pull_low = trigger - 0.10 * atr14
                  pull_high = trigger + 0.20 * atr14
                  tp1 = trigger - risk
                  tp2 = trigger - 2.0 * risk
                  if current >= enterable:
                      decision = '🟢 STILL ENTERABLE'
                  elif current >= too_late:
                      decision = '🟡 CHASING — WAIT FOR PULLBACK'
                  else:
                      decision = '🔴 TOO LATE — DO NOT CHASE'
              else:
                  enterable = trigger + enter_buffer
                  too_late = trigger + late_buffer
                  chasing_text = f"{enterable:.2f} – {too_late:.2f}"
                  pull_low = trigger - 0.20 * atr14
                  pull_high = trigger + 0.10 * atr14
                  tp1 = trigger + risk
                  tp2 = trigger + 2.0 * risk
                  if current <= enterable:
                      decision = '🟢 STILL ENTERABLE'
                  elif current <= too_late:
                      decision = '🟡 CHASING — WAIT FOR PULLBACK'
                  else:
                      decision = '🔴 TOO LATE — DO NOT CHASE'

              current_risk = abs(current - stop)
              current_reward = abs(tp1 - current)
              rr = current_reward / current_risk if current_risk > 0.01 else 99.0

              age_text = 'unknown'
              try:
                  completed = datetime.fromisoformat(str(s.completed_dt))
                  age_sec = max(0, int((now_et - completed).total_seconds()))
                  age_text = f"{age_sec // 60}m {age_sec % 60}s"
              except Exception:
                  pass

              confirmed = ('CONFIRMED' in status)
              header = f"{'🔴' if is_short else '🟢'} QCC {side} {'CONFIRMED' if confirmed else status} — {s.symbol}"
              entry_line = (f"🟢 Enterable:  {'≥' if is_short else '≤'} ${enterable:.2f}")
              late_line = (f"🔴 Too late:   {'<' if is_short else '>'} ${too_late:.2f}")

              lines = [
                  header,
                  '',
                  '💰 PRICE',
                  f"Signal:       ${trigger:.2f}",
                  f"Current:      ${current:.2f}",
                  f"Signal age:   {age_text}",
                  '',
                  '🎯 ENTRY GUIDE',
                  entry_line,
                  f"🟡 Chasing:    ${chasing_text}",
                  late_line,
                  '',
                  '↩️ PULLBACK ENTRY',
                  f"Preferred:    ${pull_low:.2f} – ${pull_high:.2f}",
                  '',
                  '🛑 CUT LOSS',
                  f"${stop:.2f}",
                  '',
                  '🎯 POTENTIAL TAKE PROFIT',
                  f"TP1:          ${tp1:.2f}",
                  f"TP2:          ${tp2:.2f}",
                  '',
                  '📊 SETUP',
                  f"RVOL:         {float(s.rel_volume):.2f}x",
                  f"EMA9:         ${float(s.ema9):.2f}",
                  f"EMA21:        ${float(s.ema21):.2f}",
                  f"ATR14:        ${atr14:.2f}",
                  f"Status:       {status}",
                  f"Current R:R:  {rr:.2f}:1",
                  '',
                  '⚡ DECISION',
                  decision,
              ]
              if not confirmed:
                  lines += ['', 'ℹ️ This is not a confirmed breakout; treat the levels as a setup guide only.']
              if entry_cutoff_passed(now_et):
                  lines += ['', '⏱️ After the 15:30 ET entry cutoff — informational only; do not treat as a new 0DTE entry signal.']
              return '\\n'.join(lines)
          ''').lstrip()

          lines = src.splitlines(keepends=True)
          start = fn.lineno - 1
          end = fn.end_lineno
          new_src = ''.join(lines[:start]) + new_fn + ''.join(lines[end:])
          if backup.exists():
              backup.unlink()
          backup.write_text(src)
          p.write_text(new_src)
          try:
              py_compile.compile(str(p), doraise=True)
              test_code = '''\nfrom types import SimpleNamespace\nfrom datetime import datetime\nimport chatgpt_trigger_monitor as m\ns = SimpleNamespace(status="LONG_CONFIRMED", symbol="TEST", up_trigger=102.0, down_trigger=100.0, observed_price=102.1, atr14=1.0, completed_dt="2026-01-01T15:00:00-05:00", rel_volume=2.0, ema9=101.5, ema21=101.0)\nprint(m.format_alert(s, datetime.fromisoformat("2026-01-01T15:01:00-05:00")))\n'''
              subprocess.run(['python3','-c',test_code], cwd=str(p.parent), check=True, capture_output=True, text=True)
          except Exception:
              p.write_text(src)
              raise
          print('QCC Telegram decision guide source updated and smoke-tested.')
          PY
          /home/ubuntu/openclaw_workspace/quant_command_centre/venv/bin/python -m py_compile /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/chatgpt_trigger_monitor.py
          /usr/bin/python3 /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/qcc-control-mcp/ops_dispatch.py tests
          systemctl restart qcc-chatgpt-trigger.service
          systemctl is-active --quiet qcc-chatgpt-trigger.service
          echo 'QCC trigger service restarted successfully.'
      - name: Execute restricted Oracle dispatcher
        if: ${{ !contains(github.event.head_commit.message, 'Deploy QCC Telegram decision guide') }}
        shell: bash
        run: |
          set -euo pipefail
          cmd="${{ steps.cmd.outputs.command }}"
          if [ "$cmd" = "dispatcher-diff" ]; then
            git -C /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops status --short -- qcc-control-mcp/ops_dispatch.py
            git -C /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops diff -- qcc-control-mcp/ops_dispatch.py
          elif [ "$cmd" = "dispatcher-clean-mode" ]; then
            chmod 0644 /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/qcc-control-mcp/ops_dispatch.py
            git -C /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops status --short -- qcc-control-mcp/ops_dispatch.py
          else
            /usr/bin/python3 /home/ubuntu/openclaw_workspace/qcc-chatgpt-ops/qcc-control-mcp/ops_dispatch.py "$cmd"
          fi
